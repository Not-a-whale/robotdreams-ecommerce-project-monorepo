services:
  payments:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev-payments
    container_name: ecommerce-payments-dev
    ports:
      - '${PAYMENTS_GRPC_PORT:-50051}:50051'
    environment:
      NODE_ENV: development
      PAYMENTS_GRPC_BIND: 0.0.0.0:50051
      CHOKIDAR_USEPOLLING: 'true'
      CHOKIDAR_INTERVAL: 1000
      WATCHPACK_POLLING: 'true'
      WATCHPACK_POLLING_INTERVAL: 1000
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: DynamicPriorityPolling
      TSC_NONPOLLING_WATCHER: 'false'
    volumes:
      - ./apps/payments-service:/app/apps/payments-service
      - ./packages/contracts:/app/packages/contracts
      - /app/node_modules
      - /app/apps/payments-service/node_modules
    restart: unless-stopped
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: ecommerce-api-dev
    ports:
      - '3000:3000'
    env_file:
      - ./apps/backend/.env
    environment:
      NODE_ENV: development
      WORKER_MODE: 'false'
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
      PAYMENTS_GRPC_URL: payments:50051
      PAYMENTS_GRPC_TIMEOUT_MS: ${PAYMENTS_GRPC_TIMEOUT_MS:-5000}
      ORDER_PAYMENT_CURRENCY: ${ORDER_PAYMENT_CURRENCY:-UAH}
      CHOKIDAR_USEPOLLING: 'true'
      CHOKIDAR_INTERVAL: 1000
      WATCHPACK_POLLING: 'true'
      WATCHPACK_POLLING_INTERVAL: 1000
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: DynamicPriorityPolling
      TSC_NONPOLLING_WATCHER: 'false'
    volumes:
      - ./apps/backend:/app/apps/backend
      - ./packages/contracts:/app/packages/contracts
      - /app/node_modules
      - /app/apps/backend/node_modules
    command: npm run start:dev
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      payments:
        condition: service_started
    restart: unless-stopped
    networks:
      - internal
      - public

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: ecommerce-worker-dev
    env_file:
      - ./apps/backend/.env
    environment:
      NODE_ENV: development
      WORKER_MODE: 'true'
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
      CHOKIDAR_USEPOLLING: 'true'
      CHOKIDAR_INTERVAL: 1000
      WATCHPACK_POLLING: 'true'
      WATCHPACK_POLLING_INTERVAL: 1000
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: DynamicPriorityPolling
      TSC_NONPOLLING_WATCHER: 'false'
    volumes:
      - ./apps/backend:/app/apps/backend
      - /app/node_modules
      - /app/apps/backend/node_modules
    command: npm run start:dev
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: dev
    container_name: ecommerce-frontend-dev
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: development
      BACKEND_URL: http://api:3000
      NEXT_PUBLIC_API_URL: http://localhost:3000
      WATCHPACK_POLLING: 'true'
      CHOKIDAR_USEPOLLING: 'true'
    volumes:
      - ./apps/frontend:/app/apps/frontend:cached
      - ./packages/types:/app/packages/types:cached
      - /app/node_modules
      - /app/apps/frontend/.next
    networks:
      - public
      - internal

  postgres:
    ports:
      - '${POSTGRES_DEV_PORT:-15432}:5432'

  rabbitmq:
    ports:
      - '5672:5672'
      - '15672:15672'