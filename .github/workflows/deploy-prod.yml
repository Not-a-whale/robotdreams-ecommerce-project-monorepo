name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Immutable image tag from build-and-stage workflow (example: sha-<commit>)"
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image reference from input
        id: image
        shell: bash
        run: |
          OWNER_LC="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          API_IMAGE_REF="ghcr.io/${OWNER_LC}/ecommerce-api:${{ github.event.inputs.image_tag }}"
          WORKER_IMAGE_REF="ghcr.io/${OWNER_LC}/ecommerce-worker:${{ github.event.inputs.image_tag }}"
          PAYMENTS_IMAGE_REF="ghcr.io/${OWNER_LC}/ecommerce-payments:${{ github.event.inputs.image_tag }}"
          echo "api_image_ref=${API_IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "worker_image_ref=${WORKER_IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "payments_image_ref=${PAYMENTS_IMAGE_REF}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR for pull
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Prepare runtime environment file
        shell: bash
        run: |
          F="apps/backend/.env"
          : > "$F"
          echo "DB_HOST=postgres" >> "$F"
          echo "DB_PORT=${{ secrets.DB_PORT }}" >> "$F"
          echo "DB_USERNAME=${{ secrets.DB_USERNAME }}" >> "$F"
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> "$F"
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> "$F"
          echo "RABBITMQ_URL=${{ secrets.RABBITMQ_URL }}" >> "$F"
          echo "RABBITMQ_USER=${{ secrets.RABBITMQ_USER }}" >> "$F"
          echo "RABBITMQ_PASSWORD=${{ secrets.RABBITMQ_PASSWORD }}" >> "$F"
          echo "WORKER_MODE=false" >> "$F"
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> "$F"
          echo "JWT_EXPIRES_IN=${{ secrets.JWT_EXPIRES_IN }}" >> "$F"
          echo "REFRESH_JWT_SECRET=${{ secrets.REFRESH_JWT_SECRET }}" >> "$F"
          echo "REFRESH_JWT_EXPIRES_IN=${{ secrets.REFRESH_JWT_EXPIRES_IN }}" >> "$F"
          echo "SESSION_SECRET_KEY=${{ secrets.SESSION_SECRET_KEY }}" >> "$F"
          echo "PORT=3000" >> "$F"
          echo "AWS_REGION=${{ secrets.AWS_REGION }}" >> "$F"
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> "$F"
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> "$F"
          echo "S3_BUCKET=${{ secrets.S3_BUCKET }}" >> "$F"
          echo "S3_ENDPOINT=${{ secrets.S3_ENDPOINT }}" >> "$F"
          echo "Generated .env with $(wc -l < "$F") lines"
          cp "$F" .env

      - name: Make deploy script executable
        run: chmod +x scripts/deploy-compose.sh

      - name: Deploy to production (no rebuild)
        env:
          API_IMAGE_REF: ${{ steps.image.outputs.api_image_ref }}
          WORKER_IMAGE_REF: ${{ steps.image.outputs.worker_image_ref }}
          PAYMENTS_IMAGE_REF: ${{ steps.image.outputs.payments_image_ref }}
          RUN_MIGRATIONS: 'true'
          SMOKE_URL: ${{ vars.PROD_SMOKE_URL }}
        run: bash scripts/deploy-compose.sh production

      - name: Deployment log
        run: |
          echo "Production deploy complete"
          echo "Commit SHA (workflow): ${{ github.sha }}"
          echo "API image: ${{ steps.image.outputs.api_image_ref }}"
          echo "Worker image: ${{ steps.image.outputs.worker_image_ref }}"
          echo "Payments image: ${{ steps.image.outputs.payments_image_ref }}"
          echo "Target environment: production"
