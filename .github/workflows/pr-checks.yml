name: PR Checks

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  backend-quality-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint backend
        run: npm run lint --workspace @ecommerce/backend

      - name: Run backend unit tests
        run: npm run test --workspace @ecommerce/backend -- --runInBand

      - name: Docker build validation (quality gate)
        run: |
          docker build --target prod -t ecommerce-api:pr-check-${{ github.sha }} .
          docker build --target worker -t ecommerce-worker:pr-check-${{ github.sha }} .
