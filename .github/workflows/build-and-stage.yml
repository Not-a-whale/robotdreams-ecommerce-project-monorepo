name: Build And Stage

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - main
      - master

permissions:
  contents: read
  packages: write

jobs:
  build-artifact:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare image metadata
        id: meta
        shell: bash
        run: |
          OWNER_LC="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          IMAGE_TAG="sha-${GITHUB_SHA}"
          API_IMAGE_NAME="ghcr.io/${OWNER_LC}/ecommerce-api"
          WORKER_IMAGE_NAME="ghcr.io/${OWNER_LC}/ecommerce-worker"
          PAYMENTS_IMAGE_NAME="ghcr.io/${OWNER_LC}/ecommerce-payments"
          API_IMAGE_REF="${API_IMAGE_NAME}:${IMAGE_TAG}"
          WORKER_IMAGE_REF="${WORKER_IMAGE_NAME}:${IMAGE_TAG}"
          PAYMENTS_IMAGE_REF="${PAYMENTS_IMAGE_NAME}:${IMAGE_TAG}"

          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "api_image_ref=${API_IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "worker_image_ref=${WORKER_IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "payments_image_ref=${PAYMENTS_IMAGE_REF}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push immutable API image
        id: build_api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: prod
          push: true
          tags: ${{ steps.meta.outputs.api_image_ref }}

      - name: Build and push immutable worker image
        id: build_worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: worker
          push: true
          tags: ${{ steps.meta.outputs.worker_image_ref }}

      - name: Build and push immutable payments image
        id: build_payments
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: payments-prod
          push: true
          tags: ${{ steps.meta.outputs.payments_image_ref }}

      - name: Create release manifest
        shell: bash
        run: |
          cat > release-manifest.json <<'EOF'
          {
            "commit": "${{ github.sha }}",
            "environmentCandidate": "${{ github.ref_name }}",
            "imageTag": "${{ steps.meta.outputs.image_tag }}",
            "services": {
              "ecommerce-api": {
                "image": "${{ steps.meta.outputs.api_image_ref }}",
                "digest": "${{ steps.build_api.outputs.digest }}"
              },
              "ecommerce-worker": {
                "image": "${{ steps.meta.outputs.worker_image_ref }}",
                "digest": "${{ steps.build_worker.outputs.digest }}"
              },
              "ecommerce-payments": {
                "image": "${{ steps.meta.outputs.payments_image_ref }}",
                "digest": "${{ steps.build_payments.outputs.digest }}"
              }
            }
          }
          EOF

          echo "Release manifest:"
          cat release-manifest.json

      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ github.sha }}
          path: release-manifest.json
          retention-days: 14

  deploy-stage:
    needs: build-artifact
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: stage
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download release manifest
        uses: actions/download-artifact@v4
        with:
          name: release-manifest-${{ github.sha }}

      - name: Export image reference from manifest
        id: manifest
        shell: bash
        run: |
          API_IMAGE_REF="$(jq -r '.services["ecommerce-api"].image' release-manifest.json)"
          WORKER_IMAGE_REF="$(jq -r '.services["ecommerce-worker"].image' release-manifest.json)"
          PAYMENTS_IMAGE_REF="$(jq -r '.services["ecommerce-payments"].image' release-manifest.json)"
          IMAGE_TAG="$(jq -r '.imageTag' release-manifest.json)"
          echo "api_image_ref=${API_IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "worker_image_ref=${WORKER_IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "payments_image_ref=${PAYMENTS_IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR for pull
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Prepare runtime environment file
        shell: bash
        run: |
          F="apps/backend/.env"
          : > "$F"
          echo "DB_HOST=postgres" >> "$F"
          echo "DB_PORT=${{ secrets.DB_PORT }}" >> "$F"
          echo "DB_USERNAME=${{ secrets.DB_USERNAME }}" >> "$F"
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> "$F"
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> "$F"
          echo "RABBITMQ_URL=${{ secrets.RABBITMQ_URL }}" >> "$F"
          echo "RABBITMQ_USER=${{ secrets.RABBITMQ_USER }}" >> "$F"
          echo "RABBITMQ_PASSWORD=${{ secrets.RABBITMQ_PASSWORD }}" >> "$F"
          echo "WORKER_MODE=false" >> "$F"
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> "$F"
          echo "JWT_EXPIRES_IN=${{ secrets.JWT_EXPIRES_IN }}" >> "$F"
          echo "REFRESH_JWT_SECRET=${{ secrets.REFRESH_JWT_SECRET }}" >> "$F"
          echo "REFRESH_JWT_EXPIRES_IN=${{ secrets.REFRESH_JWT_EXPIRES_IN }}" >> "$F"
          echo "SESSION_SECRET_KEY=${{ secrets.SESSION_SECRET_KEY }}" >> "$F"
          echo "PORT=3000" >> "$F"
          echo "AWS_REGION=${{ secrets.AWS_REGION }}" >> "$F"
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> "$F"
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> "$F"
          echo "S3_BUCKET=${{ secrets.S3_BUCKET }}" >> "$F"
          echo "S3_ENDPOINT=${{ secrets.S3_ENDPOINT }}" >> "$F"
          echo "Generated .env with $(wc -l < "$F") lines"
          cp "$F" .env

      - name: Verify critical env vars
        shell: bash
        run: |
          echo "=== Diagnostic: checking secrets at expression level ==="
          echo "JWT_SECRET is set: ${{ secrets.JWT_SECRET != '' }}"
          echo "REFRESH_JWT_SECRET is set: ${{ secrets.REFRESH_JWT_SECRET != '' }}"
          echo "DB_PASSWORD is set: ${{ secrets.DB_PASSWORD != '' }}"
          echo "=== Checking .env file content ==="
          echo "Lines in .env: $(wc -l < .env)"
          echo "JWT_SECRET line: $(grep -c '^JWT_SECRET=' .env) matches"
          grep '^JWT_SECRET=' .env | awk -F= '{print "JWT_SECRET value length:", length($2)}'
          grep '^DB_PASSWORD=' .env | awk -F= '{print "DB_PASSWORD value length:", length($2)}'
          echo "==="
          MISSING=""
          for VAR in JWT_SECRET REFRESH_JWT_SECRET DB_PASSWORD; do
            VAL=$(grep "^${VAR}=" .env | cut -d= -f2-)
            if [[ -z "$VAL" ]]; then
              MISSING="${MISSING} ${VAR}"
            else
              echo "${VAR}: set (${#VAL} chars)"
            fi
          done
          if [[ -n "$MISSING" ]]; then
            echo "::error::Missing critical secrets:${MISSING}. Add them as REPOSITORY secrets in GitHub Settings → Secrets and variables → Actions → Repository secrets (NOT environment secrets, NOT variables)."
            exit 1
          fi

      - name: Make deploy script executable
        run: chmod +x scripts/deploy-compose.sh

      - name: Deploy to stage (no rebuild)
        env:
          API_IMAGE_REF: ${{ steps.manifest.outputs.api_image_ref }}
          WORKER_IMAGE_REF: ${{ steps.manifest.outputs.worker_image_ref }}
          PAYMENTS_IMAGE_REF: ${{ steps.manifest.outputs.payments_image_ref }}
          RUN_MIGRATIONS: 'true'
          SMOKE_URL: ${{ vars.STAGE_SMOKE_URL }}
        run: bash scripts/deploy-compose.sh stage

      - name: Deployment log
        run: |
          echo "Stage deploy complete"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Image tag: ${{ steps.manifest.outputs.image_tag }}"
          echo "Target environment: stage"
