name: Build And Stage

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - main
      - master

permissions:
  contents: read
  packages: write

jobs:
  build-artifact:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare image metadata
        id: meta
        shell: bash
        run: |
          OWNER_LC="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          IMAGE_TAG="sha-${GITHUB_SHA}"
          API_IMAGE_NAME="ghcr.io/${OWNER_LC}/ecommerce-api"
          WORKER_IMAGE_NAME="ghcr.io/${OWNER_LC}/ecommerce-worker"
          API_IMAGE_REF="${API_IMAGE_NAME}:${IMAGE_TAG}"
          WORKER_IMAGE_REF="${WORKER_IMAGE_NAME}:${IMAGE_TAG}"

          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "api_image_ref=${API_IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "worker_image_ref=${WORKER_IMAGE_REF}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push immutable API image
        id: build_api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: prod
          push: true
          tags: ${{ steps.meta.outputs.api_image_ref }}

      - name: Build and push immutable worker image
        id: build_worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: worker
          push: true
          tags: ${{ steps.meta.outputs.worker_image_ref }}

      - name: Create release manifest
        shell: bash
        run: |
          cat > release-manifest.json <<'EOF'
          {
            "commit": "${{ github.sha }}",
            "environmentCandidate": "${{ github.ref_name }}",
            "imageTag": "${{ steps.meta.outputs.image_tag }}",
            "services": {
              "ecommerce-api": {
                "image": "${{ steps.meta.outputs.api_image_ref }}",
                "digest": "${{ steps.build_api.outputs.digest }}"
              },
              "ecommerce-worker": {
                "image": "${{ steps.meta.outputs.worker_image_ref }}",
                "digest": "${{ steps.build_worker.outputs.digest }}"
              }
            }
          }
          EOF

          echo "Release manifest:"
          cat release-manifest.json

      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ github.sha }}
          path: release-manifest.json
          retention-days: 14

  deploy-stage:
    needs: build-artifact
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: stage
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download release manifest
        uses: actions/download-artifact@v4
        with:
          name: release-manifest-${{ github.sha }}

      - name: Export image reference from manifest
        id: manifest
        shell: bash
        run: |
          API_IMAGE_REF="$(jq -r '.services["ecommerce-api"].image' release-manifest.json)"
          WORKER_IMAGE_REF="$(jq -r '.services["ecommerce-worker"].image' release-manifest.json)"
          IMAGE_TAG="$(jq -r '.imageTag' release-manifest.json)"
          echo "api_image_ref=${API_IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "worker_image_ref=${WORKER_IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR for pull
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Prepare runtime environment file
        shell: bash
        run: |
          cat > apps/backend/.env <<EOF
          DB_HOST=postgres
          DB_PORT=${{ secrets.DB_PORT }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ secrets.DB_NAME }}
          RABBITMQ_URL=${{ secrets.RABBITMQ_URL }}
          RABBITMQ_USER=${{ secrets.RABBITMQ_USER }}
          RABBITMQ_PASSWORD=${{ secrets.RABBITMQ_PASSWORD }}
          WORKER_MODE=false
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN=${{ secrets.JWT_EXPIRES_IN }}
          REFRESH_JWT_SECRET=${{ secrets.REFRESH_JWT_SECRET }}
          REFRESH_JWT_EXPIRES_IN=${{ secrets.REFRESH_JWT_EXPIRES_IN }}
          PORT=3000
          AWS_REGION=${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_BUCKET=${{ secrets.S3_BUCKET }}
          S3_ENDPOINT=${{ secrets.S3_ENDPOINT }}
          EOF

      - name: Make deploy script executable
        run: chmod +x scripts/deploy-compose.sh

      - name: Deploy to stage (no rebuild)
        env:
          API_IMAGE_REF: ${{ steps.manifest.outputs.api_image_ref }}
          WORKER_IMAGE_REF: ${{ steps.manifest.outputs.worker_image_ref }}
          RUN_MIGRATIONS: 'true'
          SMOKE_URL: ${{ vars.STAGE_SMOKE_URL }}
        run: bash scripts/deploy-compose.sh stage

      - name: Deployment log
        run: |
          echo "Stage deploy complete"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Image tag: ${{ steps.manifest.outputs.image_tag }}"
          echo "Target environment: stage"
